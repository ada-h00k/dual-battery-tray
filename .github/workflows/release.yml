name: Build and Release

on:
  push:

permissions:
  contents: write

# Wenn ein neuer Commit gepusht wird, wird ein laufender Build
# desselben Branches automatisch abgebrochen.
concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Package release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA:0:7}"
          package_name="dual-battery-tray-${short_sha}-linux-x86_64"
          package_dir="$RUNNER_TEMP/$package_name"
          archive="$RUNNER_TEMP/${package_name}.tar.gz"
          checksum="$RUNNER_TEMP/${package_name}.sha256"

          mkdir -p "$package_dir/systemd" "$package_dir/udev"

          install -Dm755 target/release/dual-battery-tray \
            "$package_dir/dual-battery-tray"

          install -Dm644 README.md \
            "$package_dir/README.md"

          install -Dm644 LICENSE \
            "$package_dir/LICENSE"

          install -Dm644 config.toml.example \
            "$package_dir/config.toml.example"

          install -Dm644 systemd/dual-battery-tray.service \
            "$package_dir/systemd/dual-battery-tray.service"

          install -Dm644 udev/70-dual-battery-tray-keychron.rules \
            "$package_dir/udev/70-dual-battery-tray-keychron.rules"

          tar -C "$RUNNER_TEMP" -czf "$archive" "$package_name"
          sha256sum "$archive" > "$checksum"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA:0:7}"
          release_tag="build-${short_sha}"

          gh release create "$release_tag" \
            --title "Build ${short_sha}" \
            --notes "Automated release for commit ${COMMIT_SHA}." \
            "$ARCHIVE" \
            "$CHECKSUM"
