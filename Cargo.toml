[package]
name = "dual-battery-tray"
version = "0.5.2"
edition = "2021"
rust-version = "1.80"
description = "Linux tray monitor for an OpenLinkHub headset and a Keychron K2 HE over Keychron Link"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
ksni = "0.3.6"
notify-rust = "4.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
