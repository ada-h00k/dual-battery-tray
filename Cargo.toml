[package]
name = "dual-battery-tray"
version = "6.2.0"
edition = "2021"
rust-version = "1.80"
description = "Linux tray monitor for a HeadsetControl headset, a Keychron K2 HE over Keychron Link and a Keychron M5 mouse over Ultra-Link 8K"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
ksni = "0.3.6"
notify-rust = "4.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "process", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
